<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Paperhand · test app</title>
<meta name="description" content="Paperhand test app. An agent on Comfy that locks tokens in NFT vaults behind a price range, on 0G." />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3CclipPath%20id%3D%22c%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2226%22%2F%3E%3C%2FclipPath%3E%3C%2Fdefs%3E%3Cg%20clip-path%3D%22url%28%23c%29%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%2316132B%22%2F%3E%3Cpath%20d%3D%22M0%2064%20L50%2052%20L100%2064%20V100%20H0%20Z%22%20fill%3D%22%235A3FD0%22%2F%3E%3Cpath%20d%3D%22M0%2064%20L50%2052%20L100%2064%20L100%2068%20L50%2056%20L0%2068%20Z%22%20fill%3D%22%238C73F0%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
<!-- Optional. Anything it sets overrides the defaults below, so an address change
     is a two line edit in a 1 kB file instead of a rebuild. Missing is fine. -->
<script src="config.js" onerror="void 0"></script>
<style>
:root{
  --paper:#F6F4FA;
  --panel:#FFFFFF;
  --ink:#16132B;
  --muted:#726E86;
  --rule:#E4E1EE;
  --soft:#EFECF6;
  --free:#5A3FD0;
  --free-soft:#EEEAFC;
  --alert:#C2302A;
  --alert-soft:#FBECEA;
  --r:20px;
  --rs:12px;
  --ease:cubic-bezier(.2,.7,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);overflow:hidden;
  font-family:"Archivo",ui-sans-serif,system-ui,sans-serif;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html[lang^="zh"] body{font-family:"Archivo","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",ui-sans-serif,sans-serif}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.03em;line-height:1.08}
h1{font-size:clamp(27px,4.6vw,54px)}
h2{font-size:17px;letter-spacing:-.01em}
h3{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
html[lang^="zh"] h1,html[lang^="zh"] h2,html[lang^="zh"] h3{letter-spacing:0}
html[lang^="zh"] h1{font-size:clamp(23px,3.8vw,44px)}
p{margin:0}
button{font:inherit;font-variant-numeric:tabular-nums;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;font-variant-numeric:tabular-nums;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

/* --------------------------------------------------------------- arrival
   A fill sweeps up the screen, holds for a beat, then keeps going and takes
   itself off the top. Same waterline as the mark.                          */
.ph-enter{position:fixed;inset:0;z-index:999;pointer-events:none;overflow:hidden}
.ph-wave{position:absolute;left:-2vw;width:104vw;height:140vh;top:0;
  transform:translateY(100%);animation:phSweep 1.25s var(--ease) both}
.ph-wave .cap{position:absolute;left:0;right:0;bottom:100%;height:9vw;min-height:60px}
.ph-wave .body{position:absolute;inset:0;background:var(--free)}
.ph-enter .word{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--paper);
  font-size:clamp(28px,6vw,40px);font-weight:700;letter-spacing:-.035em;opacity:0;animation:phWord 1.25s var(--ease) both}
@keyframes phSweep{
  0%{transform:translateY(100%)}
  34%{transform:translateY(0)}
  52%{transform:translateY(0)}
  100%{transform:translateY(-140%)}
}
@keyframes phWord{0%,22%{opacity:0}38%,52%{opacity:1}72%,100%{opacity:0}}

/* ------------------------------------------------------------ backdrop */
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(64px);opacity:.5}
.o1{width:380px;height:380px;background:#D4CBF5;left:-6%;top:12%;animation:drift1 46s ease-in-out infinite}
.o2{width:320px;height:320px;background:#F3DFC6;right:-4%;top:6%;animation:drift2 58s ease-in-out infinite}
.o3{width:300px;height:300px;background:#E2DCF2;right:8%;bottom:-8%;animation:drift3 52s ease-in-out infinite}
.o4{width:240px;height:240px;background:#F1E6F6;left:16%;bottom:-6%;animation:drift1 64s ease-in-out infinite reverse}
@keyframes drift1{50%{transform:translate3d(60px,40px,0) scale(1.12)}}
@keyframes drift2{50%{transform:translate3d(-50px,50px,0) scale(1.08)}}
@keyframes drift3{50%{transform:translate3d(-40px,-40px,0) scale(1.14)}}

/* ---------------------------------------------------------------- shell */
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
nav{display:flex;align-items:center;gap:12px;padding:0 20px;height:64px;flex:none}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.03em;font-size:18px;flex:none;color:inherit;text-decoration:none}
.glyph{width:18px;height:18px;display:block;flex:none;overflow:visible}
.glyph{transition:transform .18s var(--ease)}
.glyph .fill{transition:transform .6s var(--ease)}
.logo:hover .glyph .fill{transform:translateY(-12px)}
.logo:active .glyph{transform:scale(.9)}
.logo.splash .glyph .fill{animation:splash .95s var(--ease)}
@keyframes splash{0%{transform:translateY(0)}38%{transform:translateY(-62px)}58%{transform:translateY(-55px)}100%{transform:translateY(0)}}
.tabs{display:flex;gap:2px;margin-left:10px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 13px;border-radius:100px;font-size:14.5px;color:var(--muted);white-space:nowrap;
  transition:color .16s,background .16s,transform .12s var(--ease)}
.tabs button:hover{color:var(--ink)}
.tabs button:active{transform:scale(.96)}
.tabs button[aria-selected="true"]{background:var(--soft);color:var(--ink);font-weight:600}
nav .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--panel);
  border-radius:100px;padding:7px 13px;font-size:13px;color:var(--muted);transition:border-color .16s,color .16s,background .16s}
.pill.on{border-color:var(--free);color:var(--free);background:var(--free-soft)}
.pill.on .dot{animation:blip 2.6s ease-in-out infinite}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
@keyframes blip{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.asset .links{display:flex;gap:9px;font-size:12px;margin-top:1px}
.asset .links a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule);transition:color .16s,border-color .16s}
.asset .links a:hover{color:var(--ink);border-color:var(--ink)}
td .sub{font-size:12px;color:var(--muted);margin-top:1px}
.tag.warn{background:#FBF1E6;color:#8A5A1B}
.buy{display:inline-block;border:1px solid var(--rule);border-radius:100px;padding:6px 14px;font-size:13px;
  font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap;
  transition:transform .14s var(--ease),border-color .16s,background .16s}
.buy:hover{transform:translateY(-1px);border-color:var(--ink);background:var(--soft)}
/* the status pill: centred on its own line box, violet, alive */
.chip{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;flex:none;
  height:30px;padding:0 13px 0 11px;line-height:1;white-space:nowrap;
  font-size:12.5px;font-weight:600;letter-spacing:.01em;color:var(--free);
  background:linear-gradient(180deg,#F4F1FD 0%,#E8E2FA 100%);
  border:1px solid #D6CDF4;border-radius:100px;
  box-shadow:inset 0 1px 0 #FFFFFF,0 6px 16px -10px rgba(90,63,208,.55);
  animation:chipIn .7s var(--ease) .25s both}
.chip::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--free);
  animation:ping 2.2s ease-out infinite}
.chip::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);
  transform:translateX(-130%);animation:sheen 5s ease-in-out 1.4s infinite}
@keyframes chipIn{from{opacity:0;transform:translateY(-6px) scale(.94)}to{opacity:1;transform:none}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(90,63,208,.5)}70%{box-shadow:0 0 0 7px rgba(90,63,208,0)}100%{box-shadow:0 0 0 0 rgba(90,63,208,0)}}
@keyframes sheen{0%,62%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@media (max-width:420px){ .chip{display:none} }
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:100px;background:var(--panel);overflow:hidden}
.lang button{padding:7px 11px;font-size:13px;color:var(--muted);line-height:1.2;transition:background .16s,color .16s}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.btn{position:relative;background:var(--ink);color:var(--paper);border-radius:100px;padding:10px 18px;
  font-weight:600;font-size:14px;overflow:hidden;
  transition:transform .14s var(--ease),box-shadow .2s var(--ease),opacity .14s,background .16s,border-color .16s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -10px rgba(22,19,43,.55)}
.btn:active{transform:translateY(0) scale(.98);box-shadow:none}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:var(--panel);color:var(--alert);border:1px solid var(--rule)}
.btn.danger:hover{background:var(--alert-soft);border-color:var(--alert)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.block{display:block;width:100%;padding:15px;font-size:16px;border-radius:var(--rs)}
.btn .ink{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);pointer-events:none;
  animation:ripple .55s var(--ease) forwards}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}

/* ------------------------------------------------------------ test bar
   One line under the nav that says what this page is: a rehearsal. Nothing
   on it touches the chain, and the way back to a clean slate is right there. */
.testbar{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  margin:0 auto 6px;padding:7px 8px 7px 14px;border-radius:100px;max-width:calc(100% - 24px);
  background:var(--panel);border:1px dashed #CFC6F2;font-size:13px;color:var(--muted)}
.testbar b{color:var(--free);font-weight:700}
.testbar .soonpill{font-size:12px;font-weight:600;color:var(--ink);background:var(--soft);border-radius:100px;padding:3px 10px}
.testbar button{font-size:13px;font-weight:600;color:var(--ink);padding:4px 10px;border-radius:100px;transition:background .16s}
.testbar button:hover{background:var(--soft)}
@media (max-width:620px){ .testbar .soonpill{display:none} }
.guide{display:grid;gap:12px;padding:4px 2px 8px}
.guide ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:g}
.guide li{counter-increment:g;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;
  background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:14px 16px}
.guide li::before{content:counter(g);width:26px;height:26px;border-radius:9px;background:var(--soft);color:var(--muted);
  display:grid;place-items:center;font-size:13px;font-weight:600}
.guide li b{display:block;font-size:14.5px;margin-bottom:3px}
.guide li p{color:var(--muted);font-size:13.5px;max-width:64ch}
.guide li .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.guide .chain{font-size:12.5px;color:var(--muted);margin-top:8px}
.guide .chain code{font-family:inherit;font-weight:600;color:var(--ink)}
.guide .soon{background:var(--free-soft);border:1px solid #D9D1F4;border-radius:14px;padding:14px 16px}
.guide .soon b{display:block;font-size:14.5px;margin-bottom:4px;color:var(--free)}
.guide .soon p{color:#4A3F7A;font-size:13.5px;max-width:68ch}
.btn.dim{opacity:.4;pointer-events:none}

/* ----------------------------------------------------------------- main */
main{flex:1;min-height:0;display:grid;grid-template-rows:1fr auto 1fr;justify-items:center;align-items:center;
  padding:0 clamp(12px,3vw,28px) 20px;width:100%}
.headline{grid-row:1;align-self:end;text-align:center;width:min(940px,94vw);padding-bottom:clamp(16px,2.6vh,30px);
  animation:rise .5s var(--ease) both}
.headline p{margin:12px auto 0;color:var(--muted);font-size:clamp(15px,1.5vw,18px);max-width:58ch}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.card{grid-row:2;width:100%;max-width:480px;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  box-shadow:0 1px 2px rgba(22,19,43,.04),0 18px 44px -28px rgba(22,19,43,.3);
  display:flex;flex-direction:column;max-height:calc(100dvh - 148px);overflow:hidden;
  transition:max-width .24s var(--ease)}
.card.wide{max-width:820px}
.card .pad{padding:18px}
.card .scroll{overflow:auto;min-height:0;overscroll-behavior:contain}
.card .top{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 15px;
  border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg,var(--panel) 0%,rgba(239,236,246,.6) 100%)}
.card .top .ttl{flex:1;min-width:0}
.card .top h2{margin:0}
.card .top .sub{margin-top:4px;font-size:12.5px;color:var(--muted);line-height:1.45}
.card .top .pill{margin-top:2px}
.view{display:none}
.view.on{display:flex;flex-direction:column;min-height:0;animation:fade .22s var(--ease) both}
@keyframes fade{from{opacity:0}}

/* ----------------------------------------------------------------- lock */
.field{background:var(--soft);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;transition:box-shadow .16s}
.field:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.field .line{display:flex;align-items:center;gap:10px}
.field input{border:none;background:none;padding:0;width:100%;min-width:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.field input:focus{outline:none}
.field input::placeholder{color:#C4C0D2}
.field .sub{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:10px}
.field .sub .bal{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%;
  font-variant-numeric:tabular-nums;cursor:pointer}
.field .sub .bal b{color:var(--ink);font-weight:600}
.pcts{display:flex;gap:14px;margin-top:6px}
.pcts button{padding:0;font-size:12px;color:var(--muted);background:none;border:0;
  transition:color .14s}
.pcts button:hover{color:var(--ink)}
.pcts button[aria-pressed="true"]{color:var(--free);font-weight:600}
.picker{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--rule);border-radius:100px;
  padding:6px 12px 6px 7px;font-weight:600;font-size:14px;flex:none;transition:border-color .16s,transform .14s var(--ease)}
.picker:hover{border-color:var(--ink);transform:translateY(-1px)}
.picker select{border:none;background:none;font-weight:600;cursor:pointer;-webkit-appearance:none;appearance:none}
.picker select:focus{outline:none}
.picker #token-mark{display:block;width:26px;height:26px}
.picker #token-mark svg,.picker #token-mark img{display:block;width:26px;height:26px;border-radius:8px;
  outline:1px solid rgba(22,19,43,.09);outline-offset:-1px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duo .field{margin-bottom:8px}
.duo input{font-size:19px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--free);width:0%;transition:width .45s var(--ease)}
.barline{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-top:8px}
.barline b{color:var(--ink);font-weight:600}
.summary{padding:12px 14px;border:1px solid var(--rule);border-radius:var(--rs);margin-bottom:10px}
.sumrow{display:flex;gap:14px;align-items:center}
.sumbody{flex:1;min-width:0}
.preview{width:74px;flex:none;border-radius:8px;overflow:hidden;line-height:0;padding:0;
  box-shadow:0 8px 18px -14px rgba(22,19,43,.6);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.preview:hover{transform:translateY(-2px) rotate(-1.5deg);box-shadow:0 14px 26px -16px rgba(22,19,43,.6)}
.preview svg{display:block;width:100%;height:auto}
.zoom{position:fixed;inset:0;z-index:90;background:rgba(22,19,43,.45);display:grid;place-items:center;padding:24px;
  animation:fade .2s var(--ease) both;cursor:zoom-out}
.zoom.wide{cursor:auto}
.pnl{width:min(760px,92vw)}
.pnl .shot{border-radius:14px;overflow:hidden;line-height:0;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.pnl .shot svg{display:block;width:100%;height:auto}
.pnl .acts{display:flex;gap:8px;justify-content:center;margin-top:14px}
.pnl .acts .btn{text-decoration:none}
.zoom .inner{width:min(300px,78vw);border-radius:16px;overflow:hidden;line-height:0;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.7);animation:pop .3s var(--ease) both}
.zoom .inner svg{display:block;width:100%;height:auto}
.zoom p{margin-top:14px;color:#fff;font-size:13px;text-align:center;opacity:.85}
.ask{position:fixed;inset:0;z-index:95;background:rgba(22,19,43,.42);display:grid;place-items:center;padding:22px;
  animation:fade .18s var(--ease) both;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.ask.out{animation:fade .16s var(--ease) reverse both}
.ask .sheet{width:min(400px,100%);background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  padding:22px 22px 18px;box-shadow:0 34px 60px -30px rgba(22,19,43,.55);animation:pop .22s var(--ease) both}
.ask h3{font-size:17px;margin-bottom:8px}
.ask p{font-size:13.5px;color:var(--muted);line-height:1.55;max-width:46ch}
.ask .row{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.ask .btn{min-width:104px;justify-content:center}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);padding:3px 0}
.kv b{color:var(--ink);font-weight:600}

/* ------------------------------------------------------------ portfolio */
.nfts{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:12px;padding:16px 18px 18px}
.nft{padding:8px;border:1px solid var(--rule);border-radius:var(--rs);background:var(--panel);text-align:left;
  transition:transform .2s var(--ease),border-color .2s,box-shadow .2s var(--ease)}
.nft:hover{transform:translateY(-3px);border-color:var(--ink);box-shadow:0 16px 30px -22px rgba(22,19,43,.5)}
.nft:active{transform:translateY(-1px) scale(.99)}
.nft .art{display:block;width:100%;border-radius:9px;overflow:hidden;background:var(--soft);line-height:0}
.nft .art svg{display:block;width:100%;height:auto}
.nft .cap{display:flex;justify-content:space-between;gap:6px;align-items:baseline;padding:9px 3px 1px;font-size:13px}
.nft .cap b{font-weight:600}
.nft .cap span{color:var(--free);font-weight:600}
.empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:14px}
.detail{display:grid;grid-template-columns:210px 1fr;gap:20px;padding:16px 18px 18px}
.detail .art.big{width:100%;border-radius:12px;background:var(--soft);overflow:hidden;line-height:0;
  box-shadow:0 20px 40px -26px rgba(22,19,43,.5);animation:pop .3s var(--ease) both}
.detail .art.big svg{display:block;width:100%;height:auto}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.back{font-size:13px;color:var(--muted);padding:2px 0;transition:color .16s,transform .16s var(--ease)}
.back:hover{color:var(--ink);transform:translateX(-2px)}
.rows .kv{padding:7px 0;border-top:1px solid var(--rule);font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 0}
.acts .btn{padding:11px 16px}
.acts .claim{flex:1 1 180px;justify-content:center;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.15}
.acts .claim .l2{font-size:11.5px;font-weight:500;opacity:.72}
.acts .claim.all{background:var(--free);border-color:var(--free)}
.acts .claim:not(:disabled){box-shadow:0 10px 22px -14px rgba(22,19,43,.75)}
.hint.top{margin:9px 0 14px}
.detail .side{display:flex;flex-direction:column;gap:12px}
.upside{padding:14px 15px 13px;border-radius:var(--rs);border:1px solid var(--rule);
  background:linear-gradient(180deg,var(--panel),var(--soft))}
.upside .head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.upside .big{font-size:28px;font-weight:700;letter-spacing:-.025em;color:var(--free);
  font-variant-numeric:tabular-nums;line-height:1}
.upside .to{font-size:12.5px;color:var(--muted)}
.upside .kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:12.5px;
  border-top:1px solid var(--rule)}
.upside .kv span{color:var(--muted)}
.upside .kv b{font-weight:600;font-variant-numeric:tabular-nums}
.upside .kv b.up{color:var(--free)}
/* the card button breathes, so it reads as the one thing worth pressing here */
.pnlbtn{position:relative;overflow:hidden;width:100%;justify-content:center;margin-top:11px;
  background:var(--free);color:var(--paper);border-color:var(--free);
  box-shadow:0 8px 18px -12px rgba(90,63,208,.8);animation:pnlGlow 2.8s ease-in-out infinite}
.pnlbtn span{position:relative;z-index:1}
.pnlbtn::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
  transform:translateX(-130%);animation:sheen 3.6s ease-in-out 0.6s infinite}
.pnlbtn:hover{transform:translateY(-1px);box-shadow:0 12px 22px -12px rgba(90,63,208,.9)}
@keyframes pnlGlow{0%,100%{box-shadow:0 8px 18px -12px rgba(90,63,208,.7)}50%{box-shadow:0 8px 24px -8px rgba(90,63,208,.95)}}
/* the resale offer runs along the whole foot of the card */
.sellbar{display:flex;align-items:center;gap:16px;margin:0 18px 18px;padding:14px 16px;
  border-radius:var(--rs);background:var(--free-soft)}
.sellbar .txt{flex:1;min-width:0}
.sellbar b{display:block;font-size:13.5px;color:var(--free)}
.sellbar span{display:block;font-size:12.5px;color:#4A3F7A;margin-top:2px}
.sellbar .btn{flex:none;text-decoration:none;background:var(--free);border-color:var(--free);color:var(--paper)}
@media (max-width:620px){ .sellbar{flex-direction:column;align-items:stretch} .sellbar .btn{justify-content:center} }
.sell{margin-top:12px;padding:12px 14px;border-radius:var(--rs);background:var(--free-soft)}
.sell b{font-size:13.5px;color:var(--free)}
.sell p{font-size:12.5px;color:#4A3F7A;margin:5px 0 10px}
.sell .btn{text-decoration:none;display:inline-block}
.send{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)}
.send input{width:100%;border:1px solid var(--rule);border-radius:var(--rs);padding:11px 12px;background:var(--panel)}
.send input:focus{outline:none;border-color:var(--ink)}

/* --------------------------------------------------------------- assets */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:6px 14px 10px;position:sticky;top:0;background:var(--panel);z-index:1}
td{padding:11px 14px;border-top:1px solid var(--rule);vertical-align:middle}
td.num,th.num{text-align:right}
tbody tr{transition:background .16s}
tbody tr:hover{background:var(--soft)}
.asset{display:flex;align-items:center;gap:11px}
.asset .tile{width:34px;height:34px;display:block;flex:none;transition:transform .35s var(--ease)}
.asset .tile svg,.asset .tile img{display:block;width:34px;height:34px;border-radius:9px;
  outline:1px solid rgba(22,19,43,.09);outline-offset:-1px}
tbody tr:hover .asset .tile{transform:translateY(-2px) rotate(-3deg)}
.tag{font-size:12px;padding:3px 9px;border-radius:100px;background:var(--free-soft);color:var(--free);font-weight:600;white-space:nowrap}
.tag.off{background:var(--soft);color:var(--muted)}
.nudge{display:inline-flex;gap:4px;align-items:center}
.nudge button{border:1px solid var(--rule);border-radius:8px;width:28px;height:28px;font-size:13px;color:var(--muted);
  line-height:1;transition:border-color .16s,color .16s,transform .12s var(--ease)}
.nudge button:hover{border-color:var(--ink);color:var(--ink)}
.nudge button:active{transform:scale(.9)}
.nudge input{width:86px;text-align:right;border:1px solid var(--rule);border-radius:8px;padding:5px 8px;background:var(--panel)}
.nudge input:focus{outline:none;border-color:var(--ink)}
.diag{margin:14px 18px 6px;border:1px solid var(--rule);border-radius:var(--rs);padding:12px 14px;font-size:13px}
.diag.ok{background:var(--free-soft);border-color:#D9D1F4}
.diag.bad{background:var(--alert-soft);border-color:#F0D6D3}
.diag.warn{background:#FBF6EC;border-color:#EADFC8}
.diag.warn .line b{color:#8A5A1B}
.diag .line{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.diag .line b{font-weight:600}
.diag.ok .line b{color:var(--free)}
.diag.bad .line b{color:var(--alert)}
.diag .line span{color:var(--muted);word-break:break-all}
.diag .rpcrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.diag .rpcrow input{flex:1;min-width:200px;border:1px solid var(--rule);border-radius:var(--rs);padding:8px 10px;background:var(--panel);font-size:13px}
.diag .rpcrow input:focus{outline:none;border-color:var(--ink)}
.diag .why{margin-top:9px;color:var(--muted);line-height:1.5}

/* ---------------------------------------------------------------- stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
.stat{background:var(--panel);padding:16px 18px}
.stat span{display:block;font-size:12.5px;color:var(--muted)}
.stat b{display:block;font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.stat.tba b{color:var(--muted)}
.block{padding:16px 18px}
.addrs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.addr{display:block;border:1px solid var(--rule);border-radius:var(--rs);padding:11px 13px;text-decoration:none;color:inherit;
  transition:border-color .16s,transform .14s var(--ease),box-shadow .2s var(--ease)}
a.addr:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:0 10px 20px -16px rgba(22,19,43,.5)}
.addr b{display:block;font-size:13.5px;font-weight:600}
.addr span{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.addr.soon{opacity:.55}
.sources{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sources div{border:1px solid var(--rule);border-radius:var(--rs);padding:12px 14px}
.sources b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--free)}
.sources span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
@media (max-width:760px){ .sources{grid-template-columns:1fr} }
table.mini td,table.mini th{padding-top:9px;padding-bottom:9px}
.market{background:var(--free-soft);margin:0 18px 6px;border-radius:var(--rs);padding:16px 18px!important}
.market p{color:#4A3F7A;font-size:13.5px;max-width:68ch;margin-bottom:10px}
.market .btn{display:inline-block;text-decoration:none;margin-top:4px}
@media (max-width:760px){ .addrs{grid-template-columns:1fr} }
.block h3{margin-bottom:10px}
.note{font-size:12.5px;color:var(--muted);padding:0 18px 18px;max-width:70ch}

/* ----------------------------------------------------------------- docs */
.docs{padding:16px 18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:20px 34px}
.docs article p{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:52ch}
.docs article.wide{grid-column:1/-1;background:var(--soft);border-radius:var(--rs);padding:14px 16px}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.docs article.lead{background:var(--ink);color:var(--paper)}
.docs article.lead p{color:#CFCBE0;font-size:14.5px;max-width:70ch}
.docs article.mkt{background:var(--free-soft)}
.docs article.mkt p{color:#4A3F7A;margin-bottom:12px}
.docs article.mkt .btn{text-decoration:none;display:inline-block}
.docs article.faqs{background:none;padding:4px 0 0}
.faqs details{border-top:1px solid var(--rule)}
.faqs details:last-child{border-bottom:1px solid var(--rule)}
.faqs summary{cursor:pointer;list-style:none;padding:13px 0;font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:16px;
  transition:color .16s}
.faqs summary::-webkit-details-marker{display:none}
.faqs summary::after{content:"+";color:var(--muted);font-weight:400;font-size:18px;line-height:1;transition:transform .25s var(--ease)}
.faqs details[open] summary::after{transform:rotate(45deg)}
.faqs summary:hover{color:var(--free)}
.faqs details p{padding:0 0 14px;margin:0;max-width:66ch;animation:fade .25s var(--ease) both}
.linkchip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--rule);
  border-radius:100px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none;
  transition:transform .14s var(--ease),border-color .16s,box-shadow .2s var(--ease)}
.linkchip:hover{transform:translateY(-1px);border-color:var(--ink);box-shadow:0 8px 18px -12px rgba(22,19,43,.5)}
.linkchip .soon-tag{display:none;font-weight:400;color:var(--muted);font-size:12px}
.linkchip.soon{opacity:.55;pointer-events:none;font-weight:500}
.linkchip.soon .soon-tag{display:inline}

/* ---------------------------------------------------------------- misc */
.foot{flex:none;text-align:center;font-size:12.5px;color:var(--muted);padding:0 20px 12px}
.status{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(6px);background:var(--ink);color:var(--paper);
  padding:11px 18px;border-radius:100px;font-size:13.5px;max-width:92vw;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s var(--ease);z-index:80}
.status.show{opacity:1;transform:translateX(-50%) translateY(0)}
.status.bad{background:var(--alert)}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .docs{grid-template-columns:1fr}
  .detail{grid-template-columns:1fr}
  .detail .art.big{max-width:190px;margin:0 auto}
}
@media (max-width:980px){
  nav{flex-wrap:wrap;height:auto;padding:10px 16px 0;gap:10px}
  .tabs{order:3;width:100%;margin:0 -16px;padding:2px 16px 10px;justify-content:center}
  .card{max-height:calc(100dvh - 186px)}
}
@media (max-width:760px){
  nav{padding:10px 14px 0}
  .tabs{margin:0 -14px;padding:2px 14px 10px;justify-content:flex-start}
  main{padding:0 12px 14px}
  .headline{display:none}
  .card{max-height:calc(100dvh - 176px);border-radius:16px}
  .card.wide{max-width:100%}
  .hide-sm{display:none}
  .nfts{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;padding:14px}
  td,th{padding-left:12px;padding-right:12px}
  .asset .tile,.asset .tile svg,.asset .tile img{width:30px;height:30px}
  .stat b{font-size:18px}
  .btn.block{padding:14px}
}
@media (max-height:700px){.headline{display:none}}
@media (prefers-reduced-motion:reduce){ .pnlbtn,.pnlbtn::after{animation:none!important}  .chip,.chip::before,.chip::after{animation:none!important} .orb{animation:none}*{transition:none!important;animation:none!important}}
</style>

<div class="app">

            <path d="M0 64 Q25 58 50 52 Q75 58 100 64 L100 68 Q75 62 50 56 Q25 62 0 68 Z" fill="#8C73F0"><animate class="wave" attributeName="d" dur="1.8s" repeatCount="indefinite" begin="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" values="M0 64 Q25 58 50 52 Q75 58 100 64 L100 68 Q75 62 50 56 Q25 62 0 68 Z;M0 60 Q25 50 50 58 Q75 66 100 58 L100 62 Q75 70 50 62 Q25 54 0 64 Z;M0 65 Q25 67 50 56 Q75 47 100 61 L100 65 Q75 51 50 60 Q25 71 0 69 Z;M0 64 Q25 58 50 52 Q75 58 100 64 L100 68 Q75 62 50 56 Q25 62 0 68 Z"/></path>

    <div class="tabs" id="tabs" role="tablist">

      <button role="tab" data-view="lock" aria-selected="true" data-t="nav.lock"></button>

      <button role="tab" data-view="assets" aria-selected="false" data-t="nav.assets"></button>

<script>
/* =================================================================== config
   TEST VERSION. The vault contract is not deployed yet, so every price,
   balance and vault on this page is simulated in the browser (localStorage).
   The wallet connection is real: it adds 0G Mainnet (chain 16661) and switches
   to it, but nothing is ever signed or sent.
   Going live is a config change: set VAULT, PAPERHAND and TREASURY (here or
   in config.js), give each token its address, and set TEST_MODE to false.  */
const COMFY = "https://www.comfy.fun";

const CONFIG = {
  TEST_MODE: true,
  VAULT: "",                                          // PaperhandVault on 0G, coming soon
  PAPERHAND: "",                                      // $PAPERHAND, launched on Comfy
  TREASURY: "",                                       // buyback and burn treasury
  MARKET: "",                                         // NFT marketplace for vaults, coming soon
  FEES: { trade: 1, agent: 50 },                      // Comfy trade fee, and the creator share the agent receives
  RPC: "https://evmrpc.0g.ai",                        // public, no key, read only
  EXPLORER: "https://chainscan.0g.ai",
  CHAIN: {
    chainId: "0x4115",                                // 16661
    chainName: "0G Mainnet",
    nativeCurrency: { name: "0G", symbol: "0G", decimals: 18 },
    rpcUrls: ["https://evmrpc.0g.ai"],
    blockExplorerUrls: ["https://chainscan.0g.ai"]
  },
  MAX_FEED_AGE: 86400,
  SNAPSHOT_AT: "",
  /* Test tokens. They stand in for tokens launched on Comfy; none of them is
     real and none has an address. At launch any Comfy token can be locked. */
  TOKENS: [
    { symbol: "COZY", name: "Cozy agent (test)",  tint: "#5A3FD0", decimals: 18, demo: 0.0042, demoBalance: 250000, address: "", feed: "", trade: COMFY },
    { symbol: "NAPS", name: "Naps agent (test)",  tint: "#2F6FB0", decimals: 18, demo: 0.0187, demoBalance: 60000,  address: "", feed: "", trade: COMFY },
    { symbol: "WARM", name: "Warm agent (test)",  tint: "#C0673A", decimals: 18, demo: 0.0009, demoBalance: 900000, address: "", feed: "", trade: COMFY },
    { symbol: "PURR", name: "Purr agent (test)",  tint: "#2E8A7E", decimals: 18, demo: 0.0631, demoBalance: 15000,  address: "", feed: "", trade: COMFY },
    { symbol: "HEARTH", name: "Hearth agent (test)", tint: "#8A4FA8", decimals: 18, demo: 0.1240, demoBalance: 8000, address: "", feed: "", trade: COMFY }
  ]
};

/* config.js, when present, overrides everything in this block. Defaults stay
   here so the file still works on its own, dropped anywhere, with no server. */
if (window.PAPERHAND_CONFIG) Object.assign(CONFIG, window.PAPERHAND_CONFIG);

/* Fill these in when they exist. Anything left empty renders as a dimmed,
   non clickable label instead of a link that goes nowhere. */
const LINKS = {
  site: "../",                                        // the landing page, one folder up
  contract: "",                                       // coming soon
  paperhand: "",                                      // coming soon
  comfy: COMFY,
  x: "https://x.com/paperhandagent",
  telegram: ""
};
if (window.PAPERHAND_LINKS) Object.assign(LINKS, window.PAPERHAND_LINKS);

function applyLinks(root = document){
  root.querySelectorAll("[data-link]").forEach(a => {
    let url = LINKS[a.dataset.link];
    if (!url && a.dataset.link === "contract" && CONFIG.VAULT) url = CONFIG.EXPLORER + "/address/" + CONFIG.VAULT;
    if (!url && a.dataset.link === "paperhand" && CONFIG.PAPERHAND) url = CONFIG.EXPLORER + "/token/" + CONFIG.PAPERHAND;
    if (url){
      a.href = url;
      a.classList.remove("soon");
      if (/^https?:/.test(url)){ a.target = "_blank"; a.rel = "noopener"; }
    } else {
      a.removeAttribute("href");
      a.classList.add("soon");
    }
  });
}

  "docs.custody.p":"The contract does, and only the holder of the vault NFT can take them out. No admin key can move, seize or unlock a deposit, and the terms of a vault can never be edited once it is open. The penalty destination was set once and is permanent.",
  "docs.nft.h":"Every vault is an NFT",
  "docs.nft.p":"Opening a vault mints an NFT to your wallet. The card is drawn on chain from the asset, the range and the vault number, and it fills in as the price climbs. Sending the NFT sends the position. It is burned when the vault closes.",
  "docs.market.h":"Buying and selling vaults",
  "docs.market.p":"A holder who wants out can close and lose 30% of the locked part, or sell the NFT. Any price above the close value beats the penalty for the seller, and the buyer gets the tokens below market plus the unlock schedule. So a vault trades between its close value and its full value. The discount is at most 30% of what is still locked, and it shrinks as the price climbs and as maturity nears. Resales pay a 3% royalty to the treasury.",

  "faq.4.a":"To the treasury, alongside the 2% buy and 2% sell fees on $PAPERHAND, paid in ETH, and the 3% resale royalty. The treasury spends it buying back PAPERHAND. Its address and balances are on the $PAPERHAND tab.",
  "faq.5.q":"What happens if the price spikes and falls back?",

  "faq.6.q":"Why can a claim do nothing on a weekend?",

  "docs.mature.p":"满 700 天的金库可以零罚金关闭，无论价格走势如何。如果市场始终没到你的区间，等到期限，存款全额取回。这个日期在铸造时就已确定，并显示在每个金库上。",
  "docs.price.h":"价格从哪里来",
  "docs.price.p":"来自 Robinhood Chain 上的 Chainlink 预言机，通过公共 RPC 读取，与金库读取的是同一批代理合约。预言机给出的是一枚代币的价格，等于股价乘以代币乘数，因此略高于纳斯达克报价，并随分红再投资而漂移。",
  "docs.oracle.h":"如果预言机失效",
  "docs.oracle.p":"你的任何操作都不依赖实时价格。领取和关闭都基于已存储的最高价，所以过期、暂停或损坏的预言机都无法困住存款。如果某个预言机连续 30 天无更新，该代币上的金库关闭即免罚金。",
  "docs.custody.h":"代币由谁保管",
  "docs.custody.p":"由合约保管，只有金库 NFT 的持有人能取出。没有任何管理员密钥可以转移、没收或解锁存款，金库开启后条款也无法修改。罚金去向只设置一次，永久不变。",
  "docs.nft.h":"每个金库都是一个 NFT",
  "docs.nft.p":"开仓时会向你的钱包铸造一枚 NFT。卡面由资产、区间和金库编号在链上绘制，并随价格上涨逐渐填满。转出 NFT 就是转出仓位，金库关闭时 NFT 会被销毁。",
  "docs.market.h":"买卖金库",
  "docs.market.p":"想提前离场的持有人可以关闭金库、损失锁定部分的 30%，也可以卖掉 NFT。对卖家来说，任何高于关闭价值的价格都比罚金划算；买家则以低于市价的价格拿到代币和解锁计划。因此金库的成交价介于关闭价值和完整价值之间。折价最多是仍锁定部分的 30%，并随价格上涨和临近到期而缩小。二级转售向金库地址支付 3% 版税。",
  "docs.cost.h":"费用",
  "docs.cost.p":"开一个金库需要支付 PAPERHAND 作为费用，当场销毁。代币上线前，开仓免费。领取、转出和关闭除 gas 外没有其他费用。",
  "docs.faq.h":"常见问题",
  "faq.1.q":"如果价格一直没到我的区间怎么办？",
  "faq.1.a":"代币会一直锁定，直到金库满 700 天，届时可以免费关闭并全额取回。你也可以提前离开并对锁定部分支付 30%，或者卖掉 NFT。",
  "faq.2.q":"可以往金库里追加代币，或修改区间吗？",
  "faq.2.a":"不可以。条款在铸造时就已固定，这正是买家可以信任卡面信息的原因。需要的话请再开一个金库。",
  "faq.3.q":"为什么是 30%？",
  "faq.3.a":"足以阻止冲动，又不至于把你困死。它只作用于仍被锁定的部分，绝不涉及价格已经释放的部分。",
  "faq.4.q":"罚金去哪了？",
  "faq.4.a":"进入金库地址，同时进入的还有以 ETH 支付的 $PAPERHAND 买入 2%、卖出 2% 交易费，以及 3% 的转售版税。这些资金用于回购 PAPERHAND，地址和余额可在 $PAPERHAND 页面查看。",
  "faq.5.q":"价格冲高后又跌回来会怎样？",
  "faq.5.a":"冲高时释放的部分保持释放。金库会记住见过的最高价，永远不会收回。",
  "faq.6.q":"为什么周末领取有时没有变化？",
  "faq.6.a":"休市期间股票预言机暂停更新，金库在恢复交易前无法记录新高。已经释放的部分无论预言机状态如何，都可以随时领取。",
  "faq.7.q":"有人能拿走我的代币吗？",
  "faq.7.a":"不能。合约里没有任何转移、没收或解锁存款的函数，没有可升级代理，也没有管理员后门。只有 NFT 持有人可以领取或关闭。",
  "faq.8.q":"如果 Chainlink 停止工作呢？",
  "faq.8.a":"领取和关闭会基于已存储的状态继续工作。如果某个预言机连续 30 天无更新，该代币上的金库关闭即免罚金。",
  "faq.9.q":"可以卖掉我的金库吗？",
  "faq.9.a":"可以，它是一个 NFT，像其他 NFT 一样在 OpenSea 上架即可。买家获得整个仓位，3% 版税归金库地址。",
  "faq.10.q":"一个金库值多少？",
  "faq.10.a":"介于现在关闭能拿回的数额和库内代币完整价值之间。应用在每个金库上都会显示这两个数字。",
  "faq.11.q":"为什么代币价格和纳斯达克不一样？",
  "faq.11.a":"Robinhood 股票代币的价值等于一股乘以一个随分红再投资增长的乘数。金库以代币价格结算，这才是这里重要的数字。",
  "faq.12.q":"可以锁哪些代币？",
  "faq.12.a":"在 Robinhood Chain 上拥有 Chainlink 预言机的股票代币，都列在资产页面，并附有合约和预言机链接。",
  "faq.13.q":"开一个金库要多少钱？",
  "faq.13.a":"一笔 PAPERHAND 费用，开仓时销毁，外加 gas。代币上线前开仓免费。",
  "faq.14.q":"合约经过审计了吗？",
  "faq.14.a":"还没有。它有 38 个测试覆盖，包括一个模糊测试，验证每个存入的代币都恰好取出一次，源代码公开。请从你能接受的金额开始。",

/* ==================================================================== utils */
const $ = id => document.getElementById(id);
const WAD = 10n ** 18n;
const toWad = s => { const n = (s ?? "").toString().trim(); if (!n || isNaN(Number(n))) return null;
  try { return ethers.parseUnits(n, 18); } catch { return null; } };
const fromWad = v => Number(ethers.formatUnits(v, 18));
const locale = () => lang === "zh" ? "zh-CN" : "en-US";
const pxDigits = n => { const a = Math.abs(n); return a >= 100 ? 2 : a >= 1 ? 3 : a >= 0.01 ? 4 : a >= 0.0001 ? 6 : 8; };
const usdN = n => "$" + n.toLocaleString(locale(),{minimumFractionDigits:Math.min(2,pxDigits(n)),maximumFractionDigits:pxDigits(n)});
const usd = v => v == null ? "" : usdN(fromWad(v));
const usd0 = n => "$" + n.toLocaleString(locale(),{maximumFractionDigits:0});
const usd3 = n => "$" + n.toLocaleString(locale(),{minimumFractionDigits:2,maximumFractionDigits:n !== 0 && Math.abs(n) < 1 ? 4 : 2});
const qty = (v,d=18) => Number(ethers.formatUnits(v,d)).toLocaleString(locale(),{maximumFractionDigits:4});
const short = a => a.slice(0,6) + "\u2026" + a.slice(-4);
const day = ts => new Date(Number(ts) * 1000).toLocaleDateString(locale(), {year:"numeric",month:"short",day:"numeric"});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let statusTimer;
function say(msg, bad=false){
  const el = $("status");
  el.textContent = msg; el.classList.toggle("bad", bad); el.classList.add("show");
  clearTimeout(statusTimer); statusTimer = setTimeout(()=>el.classList.remove("show"), bad ? 6000 : 3400);
}
function reason(e){
  // ethers decodes a known custom error into e.revert, which is the real cause
  const named = e?.revert?.name || e?.info?.error?.data?.name;
  if (named && I18N.en["err." + named]) return t("err." + named);
  if (named) return named;
  const s = e?.shortMessage || e?.info?.error?.message || e?.message || "";
  if (/user rejected/i.test(s)) return t("err.declined");
  if (/TreasuryNotSet/.test(s)) return t("err.TreasuryNotSet");
  if (/StalePrice|NoPrice/.test(s)) return t("err.stale");
  if (/RangeBelowSpot|RangeBelowMarket/.test(s)) return t("err.belowSpot");
  if (/TokenNotAllowed/.test(s)) return t("err.notAllowed");
  if (/SequencerDown/.test(s)) return t("err.sequencer");
  if (/network changed/i.test(s)) return t("err.network");
  return s ? s.split("(")[0].slice(0,140) : t("err.generic");
}
function pctOf(low, high, price){
  if (low == null || high == null || price == null || high <= low) return null;
  if (price <= low) return 0;
  if (price >= high) return 100;
  return Number((price - low) * 10000n / (high - low)) / 100;
}

/* =================================================================== art

   so the card drawn here is byte for byte the card the contract serves to

/* =================================================================== art
   A line for line port of PaperhandRenderer.sol. Integer maths, BigInt only,
   so the card drawn here is byte for byte the card the contract serves to
   OpenSea and to every wallet. Verified against the on-chain output.         */
const ART_PAL = [
  ["#8C73F0","#5A3FD0","#3F2A9E","#EFECFB"], ["#4A7A9B","#2F5B78","#204257","#E9EFF4"],
  ["#B8764F","#94543A","#6E3C28","#F5ECE5"], ["#7C5C93","#5B3F6E","#432C52","#F0EBF4"],
  ["#3E8A8F","#23666B","#184B50","#E7F1F2"], ["#7E8C46","#5C6B2F","#424E21","#F0F2E7"],
  ["#A8563F","#82382A","#5F281D","#F6EAE6"], ["#5A5FA0","#3D427C","#2B2F5C","#EBECF4"]
];
const artFixed2 = (v, d) => {
  const u = 10n ** BigInt(d), whole = v / u;
  if (whole === 0n && v !== 0n){
    const small = ((v % u) * 1000000n) / u;
    return small === 0n ? "0.000001" : "0." + small.toString().padStart(6, "0");
  }
  const f = ((v % u) * 100n) / u;
  return whole.toString() + "." + (f < 10n ? "0" : "") + f.toString();
};
const artFraction = (lo, hi, m) => m <= lo ? 0n : m >= hi ? WAD : ((m - lo) * WAD) / (hi - lo);
const artPoly = (p, fill) => '<polygon points="' + p.map(String).join(" ") + '" fill="' + fill + '"/>';

function palFor(symbol){
  return ART_PAL[Number(BigInt(ethers.keccak256(ethers.toUtf8Bytes(symbol))) % 8n)];
}

/* A wide card built for sharing: the same tower, the numbers that matter, and
   nothing that needs a server to render. */
function pnlCard(v, up){
  const [top, side, dark, wash] = palFor(v.symbol);
  const pct = Math.round(v.pct);
  const filled = Math.round(pct * 11 / 100);
  let tower = '<ellipse cx="962" cy="410" rx="104" ry="26" fill="#16132B" opacity="0.06"/>';
  for (let i = 0; i < 11; i++){
    const w = Math.round(92 * (1 - i * 0.013)), h = Math.round(w / 2);
    const x = 962, y = 388 - i * 27, th = 14;
    const [a, b, c] = i < filled ? [top, side, dark] : ["#EFECF6", "#E2DEEE", "#D3CEE3"];
    tower += `<polygon points="${x-w} ${y} ${x} ${y+h} ${x} ${y+h+th} ${x-w} ${y+th}" fill="${b}"/>` +
             `<polygon points="${x+w} ${y} ${x} ${y+h} ${x} ${y+h+th} ${x+w} ${y+th}" fill="${c}"/>` +
             `<polygon points="${x} ${y-h} ${x+w} ${y} ${x} ${y+h} ${x-w} ${y}" fill="${a}"/>`;
  }
  const stat = (x, label, value) =>
    `<text x="${x}" y="470" font-size="15" letter-spacing="1.1" fill="#726E86">${esc(label.toUpperCase())}</text>` +
    `<text x="${x}" y="506" font-size="26" font-weight="700" fill="#16132B">${esc(value)}</text>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%">
    <defs><linearGradient id="pb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#FBFAFD"/>
      <stop offset="1" stop-color="${wash}"/></linearGradient></defs>
    <rect width="1200" height="675" fill="url(#pb)"/>
    <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
      <text x="72" y="96" font-size="18" letter-spacing="2.4" fill="#726E86">PAPERHAND VAULT #${esc(v.id)}</text>
      <text x="72" y="238" font-size="112" font-weight="700" letter-spacing="-4" fill="${side}">${esc((up.pct >= 0 ? "+" : "") + up.pct.toFixed(2) + "%")}</text>
      <text x="72" y="292" font-size="26" fill="#16132B">${esc(t("pnl.line", { s: v.symbol, p: usd(v.high) }))}</text>
      <text x="72" y="332" font-size="19" fill="#726E86">${esc(t("pnl.sub", { pct: pct + "%" }))}</text>
      <text x="72" y="364" font-size="19" fill="#726E86">${esc(t("pnl.vs", { pct: (up.vsExit >= 0 ? "+" : "") + up.vsExit.toFixed(2) + "%" }))}</text>
      ${tower}
      <line x1="72" y1="416" x2="1128" y2="416" stroke="#E4E1EE"/>
      ${stat(72, t("pnl.locked"), qty(v.deposited - v.withdrawn, v.dec) + " " + v.symbol)}
      ${stat(352, t("pnl.now"), usd3(up.now))}
      ${stat(632, t("pnl.exit"), usd3(up.liquid))}
      ${stat(912, t("pnl.full"), usd3(up.full))}
      <text x="72" y="600" font-size="19" fill="#726E86">${esc(usd(v.low) + "  \u2192  " + usd(v.high))}</text>
      <text x="1128" y="600" font-size="19" font-weight="600" fill="${side}" text-anchor="end">@paperhandagent</text>
    </g></svg>`;
}

async function downloadCard(svg, name){
  const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url;
    });
    const c = document.createElement("canvas");
    c.width = 2400; c.height = 1350;
    c.getContext("2d").drawImage(img, 0, 0, 2400, 1350);
    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } finally { URL.revokeObjectURL(url); }
}

function vaultCard({ id, symbol, dec = 18, deposited, withdrawn = 0n, low, high, highWater, matured = false }){
  id = BigInt(id);
  const full = deposited - withdrawn;
  const pct = (artFraction(low, high, highWater) * 100n) / WAD;
  const released = (full * pct) / 100n;                    // mirrors the vault's own maths
  const returned = matured ? full : released + ((full - released) * 7000n) / 10000n;
  const discount = full === 0n ? 0n : ((full - returned) * 100n) / full;
  const span = low === 0n ? 0n : ((high - low) * 100n) / low;
  const status = matured ? "MATURED" : pct === 0n ? "LOCKED" : pct >= 100n ? "RELEASED" : "RELEASING";
  const seed = BigInt(ethers.keccak256(ethers.solidityPacked(["string","uint256","uint128","uint128"], [symbol, id, low, high])));
  const [top, side, dark, wash] = ART_PAL[Number(BigInt(ethers.keccak256(ethers.toUtf8Bytes(symbol))) % 8n)];
  const filled = (pct * 11n + 50n) / 100n;
  const taper = (seed >> 15n) % 26n;
  const tilt = (seed >> 60n) % 5n;
  const bw = BigInt(status.length) * 7n + 18n;

  let s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%">' +
    '<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#FBFAFD"/>' +
    '<stop offset="1" stop-color="' + wash + '"/></linearGradient></defs>' +
    '<rect width="320" height="420" rx="18" fill="url(#s)"/>' +
    '<rect x="0.5" y="0.5" width="319" height="419" rx="17.5" fill="none" stroke="#E4E1EE"/>' +
    '<g font-family="system-ui,-apple-system,Segoe UI,sans-serif">' +
    '<text x="26" y="42" font-size="11.5" letter-spacing="1.5" fill="#726E86">PAPERHAND VAULT</text>' +
    '<text x="294" y="42" font-size="11.5" fill="#726E86" text-anchor="end">#' + id + "</text>" +
    '<rect x="26" y="52" width="' + bw + '" height="19" rx="9.5" fill="' + wash + '"/>' +
    '<text x="' + (26n + bw / 2n) + '" y="65" font-size="9.5" letter-spacing="1.1" font-weight="700"' +
    ' text-anchor="middle" fill="' + side + '">' + status + "</text>" +
    '<g transform="rotate(' + (tilt >= 2n ? "" : "-") + (tilt >= 2n ? tilt - 2n : 2n - tilt) +
    ' 160 180)"><ellipse cx="160" cy="287" rx="66" ry="17" fill="#16132B" opacity="0.055"/>';
  for (let i = 0n; i < 11n; i++){
    const [t2, s2, d2] = i < filled ? [top, side, dark] : ["#EFECF6","#E2DEEE","#D3CEE3"];
    const w = (58n * (1000n - i * taper)) / 1000n, h = w / 2n;
    const x = 155n + ((seed >> (i * 5n)) % 11n), y = 268n - i * 17n;
    s += artPoly([x - w, y, x, y + h, x, y + h + 9n, x - w, y + 9n], s2) +
         artPoly([x + w, y, x, y + h, x, y + h + 9n, x + w, y + 9n], d2) +
         artPoly([x, y - h, x + w, y, x, y + h, x - w, y], t2);
  }
  s += "</g>" +
    '<text x="26" y="330" font-size="27" font-weight="700" fill="#16132B">' + artFixed2(full, dec) + "</text>" +
    '<text x="26" y="354" font-size="15" fill="#726E86">' + symbol + "</text>" +
    '<text x="294" y="330" font-size="20" font-weight="700" fill="' + side + '" text-anchor="end">' + pct + "%</text>" +
    '<text x="294" y="354" font-size="12" fill="#726E86" text-anchor="end">released</text>' +
    '<rect x="26" y="366" width="268" height="5" rx="2.5" fill="#ECE9F4"/>' +
    '<rect x="26" y="366" width="' + ((268n * pct) / 100n) + '" height="5" rx="2.5" fill="' + side + '"/>' +
    '<text x="26" y="396" font-size="13.5" fill="#726E86">$' + artFixed2(low, 18) + " to $" + artFixed2(high, 18) + "</text>" +
    (withdrawn > 0n
      ? '<text x="294" y="396" font-size="12.5" fill="#726E86" text-anchor="end">' + artFixed2(withdrawn, dec) + " claimed</text>"
      : "") +
    "</g></svg>";
  return s;
}

/* ============================================================ agent penalty
   The live agent prices an early exit from the vault's own parameters. This
   test version uses a plain, readable model so the behaviour can be tried:
   10% base, up to +20% the wider the range (capped at a 200% wide range),
   fading linearly to zero as the vault approaches 700 days. Only the part
   still locked is ever charged. Returns basis points.                       */
function agentPenalty(v){
  if (!v || v.low == null || v.high == null || v.low === 0n) return 3000;
  const width = Number((v.high - v.low) * 10000n / v.low) / 100;         // % above the bottom
  const wide = Math.min(1, Math.max(0, width / 200));
  const age = Math.max(0, Date.now() / 1000 - Number(v.createdAt || Date.now() / 1000));
  const fade = Math.max(0, 1 - age / (700 * 86400));
  return Math.round((1000 + 2000 * wide) * fade);
}
const bpsPct = b => (b / 100).toLocaleString(locale(), { maximumFractionDigits: 1 }) + "%";

/* ================================================================== oracle
   Raw JSON-RPC over fetch, so a failure can be named instead of swallowed.
   One batched POST reads every feed, every multiplier, every pause flag.   */
const FEED_IFACE = new ethers.Interface(FEED_ABI);
const STOCK_IFACE = new ethers.Interface(STOCK_ABI);

let rpcUrl = null;
function currentRpc(){
  if (rpcUrl) return rpcUrl;
  let saved = null;
  try { saved = localStorage.getItem("ph-rpc"); } catch {}
  rpcUrl = saved || CONFIG.RPC;
  return rpcUrl;
}
function setRpc(url){
  rpcUrl = url || CONFIG.RPC;
  try { url ? localStorage.setItem("ph-rpc", url) : localStorage.removeItem("ph-rpc"); } catch {}
  feedCache.clear(); oracle.state = "idle";
}

const oracle = { state: "idle", detail: "", at: 0 };

async function rpcBatch(calls){
  const url = currentRpc();
  if (!url) { oracle.state = "norpc"; return null; }
  const body = calls.map((c, i) => ({ jsonrpc: "2.0", id: i, method: "eth_call", params: [c, "latest"] }));
  let res;
  try {
    res = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body.length === 1 ? body[0] : body)
    });
  } catch (e){
    // fetch only throws like this when the request never left the page
    oracle.state = "blocked";
    oracle.detail = String(e && e.message || e);
    return null;
  }
  if (res.status === 429){ oracle.state = "ratelimited"; return null; }
  if (!res.ok){ oracle.state = "http"; oracle.detail = res.status + " " + res.statusText; return null; }
  let json;
  try { json = await res.json(); } catch { oracle.state = "http"; oracle.detail = "bad json"; return null; }
  const arr = Array.isArray(json) ? json : [json];
  if (arr[0] && arr[0].error){ oracle.state = "rpcerror"; oracle.detail = arr[0].error.message || ""; return null; }
  const out = new Array(calls.length).fill(null);
  for (const r of arr) if (r && typeof r.id === "number" && r.result) out[r.id] = r.result;
  oracle.state = "ok"; oracle.detail = ""; oracle.at = Date.now();
  return out;
}

const feedCache = new Map();

/* Several parts of the page ask for prices at once on the first render. Without
   this guard they each fire their own batch, and the losers of the race come
   back empty, which is why a vault could show Unavailable while the assets tab
   showed the price. One flight at a time, everyone waits for the same answer. */
let feedsInFlight = null;
function loadFeeds(force){
  const ready = feedCache.size === CONFIG.TOKENS.length &&
                [...feedCache.values()].every(v => Date.now() - v.at < 20000);
  if (!force && ready) return Promise.resolve();
  if (feedsInFlight) return feedsInFlight;
  feedsInFlight = loadFeedsOnce(force).finally(() => { feedsInFlight = null; });
  return feedsInFlight;
}

async function loadFeedsOnce(force){
  const fresh = [...feedCache.values()].every(v => Date.now() - v.at < 20000);
  if (!force && feedCache.size === CONFIG.TOKENS.length && fresh) return;

  const calls = [];
  const plan = [];
  for (const tk of CONFIG.TOKENS){
    if (tk.feed){
      plan.push({ tk, kind: "price", i: calls.length });
      calls.push({ to: tk.feed, data: FEED_IFACE.encodeFunctionData("latestRoundData") });
      plan.push({ tk, kind: "dec", i: calls.length });
      calls.push({ to: tk.feed, data: FEED_IFACE.encodeFunctionData("decimals") });
    }
    if (tk.address){
      plan.push({ tk, kind: "paused", i: calls.length });
      calls.push({ to: tk.address, data: STOCK_IFACE.encodeFunctionData("oraclePaused") });
    }
  }
  const res = await rpcBatch(calls);
  const now = Date.now();
  for (const tk of CONFIG.TOKENS){
    const d = { price: null, updatedAt: 0, paused: false, snapshot: false };
    if (!res && tk.snapshot){            // the chain is unreachable from here
      d.price = ethers.parseUnits(String(tk.snapshot), 18);
      d.snapshot = true;
    }
    if (res){
      const pick = k => { const e = plan.find(x => x.tk === tk && x.kind === k); return e ? res[e.i] : null; };
      let dec = 8;
      try { const raw = pick("dec"); if (raw) dec = Number(FEED_IFACE.decodeFunctionResult("decimals", raw)[0]); } catch {}
      try {
        const raw = pick("price");
        if (raw){
          const r = FEED_IFACE.decodeFunctionResult("latestRoundData", raw);
          if (r[1] > 0n){ d.price = (r[1] * WAD) / (10n ** BigInt(dec)); d.updatedAt = Number(r[3]); }
        }
      } catch {}
      try { const raw = pick("paused"); if (raw) d.paused = !!STOCK_IFACE.decodeFunctionResult("oraclePaused", raw)[0]; } catch {}
    }
    feedCache.set(tk.symbol, { at: now, data: d });
  }
}
async function readFeed(tk){
  await loadFeeds(false);
  const hit = feedCache.get(tk.symbol);
  return hit ? hit.data : null;
}

function ethersReader(){
  try { return new ethers.JsonRpcProvider(currentRpc(), { chainId: 16661, name: "0g" }, { staticNetwork: true }); }
  catch { return null; }
}

/* ====================================================================== api */
const api = {
  async spot(sym){
    if (testMode) return testPrices[sym];
    const tk = CONFIG.TOKENS.find(x => x.symbol === sym);
    if (!tk) return null;
    const f = await readFeed(tk);
    return f ? f.price : null;
  },
  async list(){
    if (testMode) return testVaults.map(v => decorate(v));
    if (!vault || !account) return [];
    const ids = await vault.vaultsOf(account);
    const out = [];
    for (const raw of ids){
      const id = raw.toString();
      const v = await vault.vaults(id);
      const tk = CONFIG.TOKENS.find(x => x.address && x.address.toLowerCase() === v.token.toLowerCase());
      let price = null, claimable = 0n;
      // the feeds the assets tab already reads, then the vault itself as a fallback
      if (tk) { try { price = await api.spot(tk.symbol); } catch {} }
      if (price == null){
        try { const [ok, p] = await vault.priceOrZero(v.token); if (ok) price = p; } catch {}
      }
      try { claimable = await vault.claimable(id); } catch {}
      out.push(decorate({ id, symbol: tk?.symbol || short(v.token), dec: tk?.decimals ?? 18,
        deposited: v.deposited, withdrawn: v.withdrawn, low: v.priceLow, high: v.priceHigh,
        highWater: v.highWater, createdAt: Number(v.createdAt) }, price, claimable));
    }
    return out;
  },
  async create(sym, amount, low, high){
    if (testMode){
      const id = String(testNextId++);
      testBalances[sym] -= amount;
      testBurned += 1;
      testVaults.push({ id, symbol: sym, dec: 18, deposited: amount, withdrawn: 0n,
        low, high, highWater: testPrices[sym], createdAt: Math.floor(Date.now()/1000) });
      saveTestState();
      return id;
    }
    const tk = CONFIG.TOKENS.find(x => x.symbol === sym);
    if (paperhandAddr && paperhandAddr !== ethers.ZeroAddress && feeAmount > 0n)
      await ensureAllowance(paperhandAddr, feeAmount, "PAPERHAND");
    await ensureAllowance(tk.address, amount, sym);
    say(t("msg.locking", { a: qty(amount, tk.decimals), s: sym }));
    await (await vault.open(tk.address, amount, low, high)).wait();
    return null;
  },
  async claim(id){
    const v = vaults.find(x => x.id === String(id));
    if (testMode){
      const raw = testVaults.find(x => x.id === String(id));
      raw.withdrawn += v.claimable;
      testBalances[raw.symbol] += v.claimable;
      if (raw.withdrawn >= raw.deposited) testVaults = testVaults.filter(x => x.id !== raw.id);
      saveTestState();
      return v.claimable;
    }
    say(t("msg.claiming"));
    await (await vault.claim(id)).wait();
    return v.claimable;
  },
  async exit(id){
    const v = vaults.find(x => x.id === String(id));
    if (testMode){
      const raw = testVaults.find(x => x.id === String(id));
      const stillLocked = raw.deposited - raw.withdrawn - v.claimable;
      const penalty = stillLocked * BigInt(agentPenalty(raw)) / 10000n;
      const returned = v.claimable + stillLocked - penalty;
      testBalances[raw.symbol] += returned;
      testTreasury[raw.symbol] += penalty;
      testVaults = testVaults.filter(x => x.id !== raw.id);
      saveTestState();
      return { returned, penalty };
    }
    const [returned, penalty] = await vault.previewClose(id);
    say(t("msg.closing"));
    await (await vault.close(id)).wait();
    return { returned, penalty };
  },
  async send(id, to){
    if (testMode){ testVaults = testVaults.filter(x => x.id !== String(id)); saveTestState(); return; }
    say(t("msg.sending", { id }));
    await (await vault.safeTransferFrom(account, to, id)).wait();
  },
  async stats(){
    const perAsset = [];
    let tvl = 0, treasury = 0;
    for (const tk of CONFIG.TOKENS){
      const price = await api.spot(tk.symbol);
      let locked = 0n, cut = 0n;
      if (testMode){
        locked = testVaults.filter(v => v.symbol === tk.symbol).reduce((s,v) => s + (v.deposited - v.withdrawn), 0n);
        cut = testTreasury[tk.symbol] || 0n;
      } else if (CONFIG.VAULT && tk.address){
        const erc = new ethers.Contract(tk.address, ERC20_ABI, provider || ethersReader());
        try { locked = await erc.balanceOf(CONFIG.VAULT); } catch {}
        try { cut = await erc.balanceOf(CONFIG.TREASURY); } catch {}
      }
      const p = price == null ? 0 : fromWad(price);
      tvl += fromWad(locked) * p;
      treasury += fromWad(cut) * p;
      perAsset.push({ tk, price, locked, cut });
    }
    let open = testMode ? testVaults.length : null, totalEver = testMode ? testNextId - 1 : null;
    if (!testMode && CONFIG.VAULT){
      try {
        const c = vault || new ethers.Contract(CONFIG.VAULT, VAULT_ABI, ethersReader());
        const [ts, nx] = await Promise.all([c.totalSupply(), c.nextVaultId()]);
        open = Number(ts); totalEver = Number(nx) - 1;
      } catch {}
    }
    let burned = testMode ? testBurned : null;
    if (!testMode && CONFIG.PAPERHAND){
      try {
        const erc = new ethers.Contract(CONFIG.PAPERHAND, ERC20_ABI, provider || ethersReader());
        const sink = await vault.FEE_SINK();
        burned = fromWad(await erc.balanceOf(sink));
      } catch {}
    }
    const closed = open != null && totalEver != null ? totalEver - open : null;
    return { perAsset, tvl, treasury, open, closed, totalEver, burned };
  }
};

function decorate(v, price, claimable){
  const spot = price !== undefined ? price : testPrices[v.symbol];
  const highWater = spot != null && spot > v.highWater ? spot : v.highWater;
  const pct = pctOf(v.low, v.high, highWater) ?? 0;
  const unlocked = v.deposited * BigInt(Math.round(pct * 1e6)) / BigInt(100e6);
  /* The contract's claimable() is a view, so it answers from the last high water
     mark anyone wrote on chain. claim() raises that mark itself before paying,
     so what you can actually take is the larger of the two: what is recorded,
     and what today's price has released. */
  const predicted = unlocked > v.withdrawn ? unlocked - v.withdrawn : 0n;
  const claimableAmt = claimable === undefined ? predicted
    : (claimable > predicted ? claimable : predicted);
  const out = { ...v, price: spot, highWater, pct, claimable: claimableAmt };
  out.art = vaultCard({ id: v.id, symbol: v.symbol, dec: v.dec, deposited: v.deposited,
    withdrawn: v.withdrawn, low: v.low, high: v.high, highWater,
    matured: Date.now() / 1000 >= Number(v.createdAt) + 700 * 86400 });
  return out;
}

async function ensureAllowance(tokenAddr, amount, label){
  const erc = new ethers.Contract(tokenAddr, ERC20_ABI, signer);
  if (await erc.allowance(account, CONFIG.VAULT) >= amount) return;
  say(t("msg.approving", { s: label }));
  await (await erc.approve(CONFIG.VAULT, amount)).wait();
}
async function connect(){
  if (!window.ethereum) return say(t("msg.noWallet"), true);
  try {
    await window.ethereum.request({ method: "eth_requestAccounts" });

    // switch the wallet first, then build the provider. Ethers pins the network
    // at construction, so a chain switch underneath it throws "network changed".
    const current = await window.ethereum.request({ method: "eth_chainId" });
    if (current !== CONFIG.CHAIN.chainId){
      try { await window.ethereum.request({ method:"wallet_switchEthereumChain", params:[{chainId:CONFIG.CHAIN.chainId}] }); }
      catch (e){
        if (e.code === 4902 || e?.data?.originalError?.code === 4902)
          await window.ethereum.request({ method:"wallet_addEthereumChain", params:[CONFIG.CHAIN] });
        else throw e;
      }
      await new Promise(r => setTimeout(r, 400));   // let the wallet settle
    }

    provider = new ethers.BrowserProvider(window.ethereum, {
      chainId: parseInt(CONFIG.CHAIN.chainId, 16),
      name: CONFIG.CHAIN.chainName
    });
    signer = await provider.getSigner();
    account = await signer.getAddress();
    if (CONFIG.VAULT){
      vault = new ethers.Contract(CONFIG.VAULT, VAULT_ABI, signer);
      try { feeAmount = await vault.creationFee(); paperhandAddr = await vault.paperhand(); } catch {}
    }
    $("connect").textContent = short(account);
    say(t("msg.connected"));
    if (view === "guide") renderGuide();
    await refresh();
  } catch (e){ say(reason(e), true); }
}

    low, high, highWater: spotPrice ?? 0n });

/* What the position is worth now, and what it is worth if the price finishes
   the range. The vault never changes the token count, so the whole upside is
   the climb itself. */
function upside(v){
  if (v.price == null) return null;
  const left = v.deposited - v.withdrawn;
  if (left === 0n) return null;
  const px = fromWad(v.price);
  const stillLocked = left - v.claimable;
  const penalty = stillLocked * BigInt(agentPenalty(v)) / 10000n;
  const now = fromWad(left) * px;                       // the tokens at today's price
  const liquid = fromWad(left - penalty) * px;          // what walking away today actually pays
  const full = fromWad(left) * fromWad(v.high);         // every token at the top of the range
  const floor = fromWad(left) * fromWad(v.low);
  return {
    now, liquid, full, floor, left,
    gain: full - now,
    pct: now > 0 ? (full / now - 1) * 100 : 0,          // the climb the range still asks for
    vsExit: liquid > 0 ? (full / liquid - 1) * 100 : 0, // measured against closing today
    cost: now - liquid                                  // what leaving early would cost
  };
}

function drawAmountUsd(){
  const a = Number($("amount").value);
  $("amount-usd").textContent = (!a || spotPrice == null) ? ""
    : "$" + (a * fromWad(spotPrice)).toLocaleString(locale(), { maximumFractionDigits: 2 });
}
function drawBar(){
  const low = toWad($("low").value), high = toWad($("high").value);
  const pct = pctOf(low, high, spotPrice);
  $("fill").style.width = (pct ?? 0) + "%";
  if (low == null || high == null || high <= low){
    $("bar-left").textContent = t("form.setRange"); $("bar-right").textContent = ""; return;
  }
  $("bar-left").innerHTML = "<b>" + usd(low) + "</b> to <b>" + usd(high) + "</b>";
  $("bar-right").textContent = pct == null ? "" : (pct === 0 ? t("form.aboveSpot") : t("form.unlocked", { p: pct.toFixed(0) }));
}

async function doLock(){
  const tk = currentToken();
  const amountStr = $("amount").value.trim();
  const low = toWad($("low").value), high = toWad($("high").value);
  if (!amountStr || Number(amountStr) <= 0) return say(t("msg.needAmount"), true);
  if (low == null || high == null) return say(t("msg.needRange"), true);
  if (high <= low) return say(t("msg.badRange"), true);
  if (spotPrice != null && low < spotPrice) return say(t("msg.belowSpot", { p: usd(spotPrice) }), true);
  if (!testMode && !CONFIG.VAULT) return say(t("msg.notDeployed"), true);
  if (!testMode && !account) return connect();

  const amount = ethers.parseUnits(amountStr, tk.decimals);
  try {
    $("lock").disabled = true;
    const id = await api.create(tk.symbol, amount, low, high);
    nextIdCache = null;
    say(id ? t("msg.locked", { id }) : t("msg.lockedLive"));
    $("amount").value = ""; drawAmountUsd();
    await refresh();
    showView("portfolio");
  } catch (e){ say(reason(e), true); }
  finally { $("lock").disabled = false; }
}

      catch (e){ say(reason(e), true); }
    };
    $("do-exit").onclick = async () => {
      const yes = await ask({
        title: t("nft.confirmExit"),
        body: t("nft.exitHint", { r: qty(returned, v.dec), p: qty(penalty, v.dec), s: v.symbol, rate: bpsPct(rate) }),
        ok: t("nft.exitNow", { rate: bpsPct(rate) }), danger: true
      });
      if (!yes) return;
      try { const r = await api.exit(v.id); say(t("msg.closed", { a: qty(r.returned, v.dec), p: qty(r.penalty, v.dec), s: v.symbol })); selected = null; await refresh(); }
      catch (e){ say(reason(e), true); }
    };
    $("do-send").onclick = () => { $("send-box").hidden = false; $("send-to").focus(); };
    $("send-cancel").onclick = () => { $("send-box").hidden = true; };
    $("send-go").onclick = async () => {
      const to = $("send-to").value.trim();

      try { await api.send(v.id, to); say(t("msg.sent", { a: short(to) })); selected = null; await refresh(); }
      catch (e){ say(reason(e), true); }
    };
    return;
  }

  if (!vaults.length){
    body.innerHTML = `<div class="empty">${esc(
      testMode ? t("portfolio.empty")

      : !account ? t("portfolio.connect") : t("portfolio.empty"))}</div>`;

  }
  body.innerHTML = `<div class="nfts">${vaults.map(v => `
    <button class="nft" data-id="${v.id}">
      <span class="art">${v.art}</span>
      <div class="cap"><b>${esc(qty(v.deposited - v.withdrawn, v.dec))} ${esc(v.symbol)}</b><span>${v.pct.toFixed(0)}%</span></div>
    </button>`).join("")}</div>`;

}

async function setPrice(sym, price){
  testPrices[sym] = price;
  for (const v of testVaults) if (v.symbol === sym && price > v.highWater) v.highWater = price; // the ratchet

  await refresh();
}

      ${step(1, `<div class="row">
          <button class="btn sm" id="g-connect">${esc(account ? short(account) : t("wallet.connect"))}</button>
          <button class="btn sm ghost" id="g-chain">${esc(t("guide.addChain"))}</button>
        </div>
        <p class="chain">${esc(t("guide.chainInfo"))} <code>0G Mainnet</code> \u00b7 <code>16661</code> \u00b7 <code>${esc(CONFIG.RPC)}</code></p>`)}
      ${step(2, `<div class="row"><button class="btn sm" id="g-lock">${esc(t("guide.goLock"))}</button></div>`)}
      ${step(3, `<div class="row"><button class="btn sm ghost" id="g-assets">${esc(t("guide.goAssets"))}</button></div>`)}
      ${step(4, `<div class="row"><button class="btn sm ghost" id="g-port">${esc(t("guide.goPortfolio"))}</button></div>`)}
      ${step(5, `<div class="row"><button class="btn sm ghost" id="g-reset">${esc(t("test.reset"))}</button></div>`)}
    </ol>
    <div class="soon"><b>${esc(t("guide.soon.h"))}</b><p>${esc(t("guide.soon.p"))}</p></div>
  </div>`;
  $("g-connect").onclick = connect;
  $("g-chain").onclick = addChain;
  $("g-lock").onclick = () => showView("lock");
  $("g-assets").onclick = () => showView("assets");
  $("g-port").onclick = () => showView("portfolio");
  $("g-reset").onclick = resetTest;
  drawChain();
}

/* =================================================================== views */
function showView(name){
  view = name; selected = null;
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "view-" + name));
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === name));
  $("card").classList.toggle("wide", name !== "lock");
  $("headline").hidden = name !== "lock";
  if (name === "docs") return renderDocs();
  if (name === "guide") return renderGuide();
  // draw what we already have, then go and get the current numbers
  if (name === "portfolio") renderPortfolio();
  if (name === "assets") renderAssets();
  if (name === "token") renderToken();
  refresh();
}
function setTestMode(){
  $("connect").style.display = "";
  feedCache.clear();
  refresh();
}
async function refresh(){
  try { vaults = await api.list(); } catch { vaults = []; }
  await refreshSpot();
  if (view === "portfolio") renderPortfolio();
  if (view === "assets") renderAssets();
  if (view === "token") renderToken();
}

/* ==================================================================== lang */
function applyLang(){
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : "en";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-t-title]").forEach(el => el.title = t(el.dataset.tTitle));
  document.querySelectorAll("#lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  if (account) $("connect").textContent = short(account);
  drawBar(); drawAmountUsd();
  if (view === "portfolio") renderPortfolio();
  if (view === "assets") renderAssets();
  if (view === "token") renderToken();
  if (view === "docs") renderDocs();
  if (view === "guide") renderGuide();
  document.querySelectorAll("[data-t-html]").forEach(el => el.innerHTML = t(el.dataset.tHtml));
  if (testMode) $("fee").textContent = t("form.costTest");
}

/* ==================================================================== boot */
$("token").innerHTML = CONFIG.TOKENS.map(x => `<option>${x.symbol}</option>`).join("");
$("token").onchange = refreshSpot;
$("amount").addEventListener("input", () => { markPct(null); drawAmountUsd(); drawPreview(); });
["low","high"].forEach(id => $(id).addEventListener("input", () => { drawBar(); drawPreview(); }));
$("preview").onclick = () => {
  const z = document.createElement("div");
  z.className = "zoom";
  z.innerHTML = '<div class="inner">' + $("preview").innerHTML + "</div><p>" + esc(t("form.previewNote")) + "</p>";
  z.onclick = () => z.remove();
  document.body.appendChild(z);
};
let balance = null;      // exact, in the token's own units

async function refreshBalance(){
  const tk = currentToken();
  balance = null;
  if (testMode) balance = testBalances[tk.symbol] ?? 0n;
  else if (account && CONFIG.VAULT){
    try {
      const erc = new ethers.Contract(tk.address, ERC20_ABI, provider || ethersReader());
      balance = await erc.balanceOf(account);
    } catch {}
  }
  $("bal").textContent = balance == null ? "\u2014" : ethers.formatUnits(balance, tk.decimals) + " " + tk.symbol;
  $("bal").title = $("bal").textContent;
}

$("pcts").onclick = e => {
  const b = e.target.closest("[data-pct]"); if (!b) return;
  if (!testMode && !account) return say(t("msg.connectFirst"));
  if (balance == null || balance === 0n) return say(t("msg.noBalance"));
  const tk = currentToken();
  const part = (balance * BigInt(b.dataset.pct)) / 100n;
  $("amount").value = ethers.formatUnits(part, tk.decimals);
  markPct(b.dataset.pct);
  drawAmountUsd(); drawPreview();
};
function markPct(pct){
  $("pcts").querySelectorAll("[data-pct]").forEach(x =>
    x.setAttribute("aria-pressed", String(pct != null && x.dataset.pct === String(pct))));
}
$("bal").onclick = () => $("pcts").querySelector('[data-pct="100"]').click();
$("lock").onclick = doLock;
$("connect").onclick = connect;
$("tb-guide").onclick = () => showView("guide");
$("tb-reset").onclick = resetTest;
if (window.ethereum && window.ethereum.on){
  window.ethereum.on("chainChanged", () => drawChain());
  window.ethereum.on("accountsChanged", a => { account = a && a[0] ? a[0] : null;
    $("connect").textContent = account ? short(account) : t("wallet.connect"); drawChain(); });
}
$("tabs").onclick = e => { const b = e.target.closest("[data-view]"); if (b) showView(b.dataset.view); };
$("lang").onclick = e => {
  const b = e.target.closest("[data-lang]"); if (!b) return;
  lang = b.dataset.lang; localStorage.setItem("ph-lang", lang); applyLang();
};
/* the logo behaves like liquid: it ripples under the cursor, and a click fills
   the vault to the brim and lets it settle before leaving for the landing */
(function(){
  const logo = document.querySelector(".logo");
  if (!logo) return;
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const waves = [...logo.querySelectorAll("animate.wave")];
  if (!still){
    logo.addEventListener("mouseenter", () => waves.forEach(a => { try { a.beginElement(); } catch {} }));
    logo.addEventListener("mouseleave", () => waves.forEach(a => { try { a.endElement(); } catch {} }));
  }
  logo.addEventListener("click", e => {
    if (still) return;
    logo.classList.remove("splash"); void logo.getBoundingClientRect(); logo.classList.add("splash");
    const href = logo.getAttribute("href");
    if (href && !href.startsWith("#")){ e.preventDefault(); setTimeout(() => { location.href = href; }, 560); }
  });
  logo.addEventListener("animationend", () => logo.classList.remove("splash"));
})();

/* One dialog, promised based, so a confirmation looks like the rest of the app
   instead of a browser alert that names the domain. */
function ask({ title, body, ok, danger }){
  return new Promise(resolve => {
    const wrap = document.createElement("div");
    wrap.className = "ask";
    wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
      <h3></h3><p></p>
      <div class="row">
        <button class="btn ghost" data-a="0"></button>
        <button class="btn ${danger ? "danger" : ""}" data-a="1"></button>
      </div></div>`;
    wrap.querySelector("h3").textContent = title;
    wrap.querySelector("p").textContent = body;
    wrap.querySelector('[data-a="0"]').textContent = t("ask.cancel");
    wrap.querySelector('[data-a="1"]').textContent = ok;
    const done = v => { wrap.classList.add("out"); setTimeout(() => wrap.remove(), 160); resolve(v); };
    wrap.onclick = e => {
      const b = e.target.closest("[data-a]");
      if (b) done(b.dataset.a === "1");
      else if (e.target === wrap) done(false);
    };
    document.addEventListener("keydown", function esc(e){
      if (!document.body.contains(wrap)) return document.removeEventListener("keydown", esc);
      if (e.key === "Escape") done(false);
      if (e.key === "Enter") done(true);
    });
    document.body.appendChild(wrap);
    requestAnimationFrame(() => wrap.querySelector('[data-a="1"]').focus());
  });
}

document.addEventListener("pointerdown", e => {
  const b = e.target.closest(".btn"); if (!b || b.disabled) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height);
  const i = document.createElement("span");
  i.className = "ink";
  i.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d/2}px;top:${e.clientY - r.top - d/2}px`;
  b.appendChild(i);
  setTimeout(() => i.remove(), 600);
});

/* the arrival sweep, once per session */
(function(){
  const el = document.getElementById("ph-enter");
  if (!el) return;
  let seen = false;
  try { seen = sessionStorage.getItem("ph-enter") === "1"; } catch {}
  if (seen || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return el.remove();
  try { sessionStorage.setItem("ph-enter", "1"); } catch {}
  setTimeout(() => el.remove(), 1500);
})();

applyLang();
setTestMode(testMode);
let firstVisit = true;
try { firstVisit = !localStorage.getItem("ph-test-state"); } catch {}
showView(testMode && firstVisit ? "guide" : "lock");
setInterval(() => { if (!testMode && vault) refresh(); }, 30000);
</script>
